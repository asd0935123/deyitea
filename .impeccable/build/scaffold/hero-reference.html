<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-2.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#284756}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <figure class="r-logo region plate" data-region="logo"><img src="../../../assets/plates/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-nav-links region text" data-region="nav-links"><!-- nav links 茶品 · 產地 · 製茶 · 泡茶 · 門市 --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- copper LINE 詢價 button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <figure class="r-pack region plate" data-region="pack"><img src="../../../assets/plates/pack.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-name region text" data-region="label-name"><!-- white spec label row: 品名 杉林溪烏龍茶 --><p style="font-size:var(--r-label-name-font);line-height:1.05;margin:0">label-name</p></div>
  <div class="r-label-origin region text" data-region="label-origin"><!-- white spec label row: 產地 南投・杉林溪 海拔 1,600m 以上 --><p style="font-size:var(--r-label-origin-font);line-height:1.05;margin:0">label-origin</p></div>
  <figure class="r-ridge region plate" data-region="ridge"><img src="../../../assets/plates/ridge.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-process region text" data-region="label-process"><!-- white spec label row: 製程 with five numbered steps 採菁 萎凋 炒菁 揉捻 乾燥 --><p style="line-height:1.05;margin:0">label-process</p></div>
  <div class="r-headline region text" data-region="headline"><!-- cream song/ming headline 喝之前，先讀懂這包茶。 two lines --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- white two-line paragraph 產地、製程、焙度，德億把每一包的來歷寫清楚。 --><p style="font-size:var(--r-lede-font);line-height:1.05;margin:0">lede</p></div>
  <div class="r-cta region control" data-region="cta"><!-- copper button LINE 詢價訂購: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <div class="r-phone region text" data-region="phone"><!-- cream text 或來電 0X-XXXX-XXXX --><p style="font-size:var(--r-phone-font);line-height:1.05;margin:0">phone</p></div>
  <div class="r-vertical-caption region text" data-region="vertical-caption"><!-- vertical writing cream caption text, two columns --><p style="font-size:var(--r-vertical-caption-font);line-height:1.05;margin:0">vertical-caption</p></div>
  <figure class="r-stamp region plate" data-region="stamp"><img src="../../../assets/plates/stamp.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
